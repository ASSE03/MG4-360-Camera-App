plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.drivehub.kamera'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.drivehub.kamera"
        minSdk 28
        targetSdk 36
        versionCode 75
        versionName "0.9.6"
        buildConfigField "boolean", "IS_BETA", "true"
        // true only in the "sim" build type: simulated cameras + calibration for the emulator
        buildConfigField "boolean", "SIMULATION", "false"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Emulator test build: ./gradlew assembleSim -> app/build/outputs/apk/sim/app-sim.apk
        // The four cameras are replaced by a simulated parking scene (sim_camera_source.h) and
        // the vehicle calibration by SimulatedCameras. Never install this on the car.
        sim {
            initWith debug
            versionNameSuffix "-sim"
            buildConfigField "boolean", "SIMULATION", "true"
            externalNativeBuild {
                cmake {
                    cppFlags "-DMG4_CAMERA_SIM=1"
                }
            }
            ndk {
                // arm64 (Apple silicon / ARM emulators) and x86_64 (Intel/AMD emulators)
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        // Local reference montage; keep private images out of release APKs.
        debug.assets.srcDir 'src/androidTest/assets/reference'
        // The sim build reuses the debug-only sources and the debug manifest (no system uid).
        sim {
            java.srcDir 'src/debug/java'
            res.srcDir 'src/debug/res'
            manifest.srcFile 'src/debug/AndroidManifest.xml'
        }
    }
    androidResources {
        // Local export sources stay available to tools but are never runtime APK assets.
        ignoreAssetsPattern = '!.svn:!.git:!CVS:!thumbs.db:!picasa.ini:!*~:car.obj:car.mtl'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
